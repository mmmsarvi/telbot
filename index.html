<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ثبت تبلیغ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      padding: 20px;
    }
    input, textarea, button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>📢 ثبت تبلیغ</h2>
  <input type="text" id="title" placeholder="عنوان تبلیغ">
  <textarea id="desc" placeholder="توضیحات"></textarea>
  <button onclick="submitAd()">ارسال تبلیغ</button>

  <script>
    function submitAd() {
      const data = {
        title: document.getElementById("title").value,
        desc: document.getElementById("desc").value
      };
      Telegram.WebApp.sendData(JSON.stringify(data));
      Telegram.WebApp.close();
    }
  </script>
</body>
</html>
